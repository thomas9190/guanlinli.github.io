{% assign redirect_url = page.url | replace: "/index.html", "/" | prepend: site.legacy_redirect_url %}
<meta http-equiv="refresh" content="0;url={{ redirect_url | escape }}">
<script>
  (function () {
    var basePath = {{ site.baseurl | default: "" | jsonify }};
    var path = window.location.pathname;
    if (basePath && (path === basePath || path.indexOf(basePath + "/") === 0)) {
      path = path.slice(basePath.length);
    }
    window.location.replace(
      {{ site.legacy_redirect_url | jsonify }} + (path || "/") +
      window.location.search + window.location.hash
    );
  }());
</script>
